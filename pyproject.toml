[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-a"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]",
    "celery[redis]>=5.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "psycopg2-binary",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "boto3",
    "anthropic>=0.30",
    "httpx",
    "tenacity",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
